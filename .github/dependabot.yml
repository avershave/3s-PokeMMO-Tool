# Weekly dependency update PRs. Minor and patch updates are grouped into one PR per ecosystem;
# major updates come one PR each, so their release notes can be read before merging.
# Every PR runs the normal CI (ci.yml, and android.yml for Android changes).
# Dependabot does not move target frameworks (e.g. net10.0 -> net12.0); do those by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      android-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: "/LiveRouteOCR"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
